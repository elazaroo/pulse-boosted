name: Bug report
description: Report something that is broken.
body:
  - type: input
    attributes:
      label: Pulse Boosted version
      placeholder: 1.0.0
    validations:
      required: true
  - type: input
    attributes:
      label: Laravel and PHP versions
      placeholder: Laravel 13.1, PHP 8.4
    validations:
      required: true
  - type: input
    attributes:
      label: Database and queue driver
      placeholder: SQL Server 2022, redis queue
    validations:
      required: false
  - type: textarea
    attributes:
      label: What happened
      description: What you expected, and what happened instead. Include the full error if there was one.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Steps to reproduce
    validations:
      required: true
